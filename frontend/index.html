<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Account Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">Bank Account Manager</div>
      <nav class="nav">
        <a href="#overview" class="nav-overview">Overview</a>
        <a href="#accounts" class="nav-accounts">Accounts</a>
        <a href="#transactions" class="nav-transactions">Transactions</a>
      </nav>
    </aside>

    <main class="main">

      <!-- ========== OVERVIEW ========== -->
      <section id="overview" class="page">
        <h1>Overview</h1>

        <form class="card" id="find-form">
          <h2>Find a customer</h2>
          <div class="row">
            <label class="field">Full name
              <input type="text" id="find-name" name="first_name">
            </label>
            <button type="submit" class="btn">Show account</button>
          </div>
          <p class="message" id="find-message"></p>
        </form>

        <!-- Result (shown after a customer is found) -->
        <div class="summary" id="summary" hidden>
          <div class="summary-name" id="summary-name"></div>
          <div class="summary-label">Current balance</div>
          <div class="summary-balance" id="summary-balance"></div>
        </div>
      </section>

      <!-- ========== ACCOUNTS ========== -->
      <section id="accounts" class="page">
        <div class="page-head">
          <div>
            <h1>Accounts</h1>
            <p class="muted" id="accounts-count"></p>
          </div>
          <button type="button" class="btn" id="new-account-btn">New account</button>
        </div>

        <form class="card card-narrow" id="new-account-form" hidden>
          <label class="field">Full name
            <input type="text" id="new-name">
          </label>
          <label class="field">Initial balance (optional)
            <input type="text" id="new-balance" inputmode="decimal" placeholder="0.00">
          </label>
          <button type="submit" class="btn">Create account</button>
          <p class="message" id="new-account-message"></p>
        </form>

        <p class="message" id="accounts-message"></p>
        <div class="list" id="accounts-list"></div>
      </section>

      <!-- ========== TRANSACTIONS ========== -->
      <section id="transactions" class="page">
        <h1>Transactions</h1>

        <form class="card card-narrow" id="transaction-form">
          <div class="toggle">
            <input type="radio" name="type" id="type-deposit" value="deposit" checked>
            <label for="type-deposit">Deposit</label>
            <input type="radio" name="type" id="type-withdraw" value="withdraw">
            <label for="type-withdraw">Withdraw</label>
          </div>

          <label class="field">Account
            <select id="account-select" name="account">
              <option value="">Select account</option>
            </select>
          </label>

          <label class="field">Amount
            <input type="text" id="amount" name="amount" inputmode="decimal" placeholder="0.00">
          </label>

          <button type="submit" class="btn">Confirm</button>
          <p class="message" id="tx-message"></p>
        </form>
      </section>

    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
